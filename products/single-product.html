<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزئیات محصول - بازانو</title>

    <!-- Favicon -->
    <link rel="shortcut icon" type="image/png" href="../assets/img/icon_bazano.png">

    <!-- Persian Fonts -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@30.1.0/dist/font-face.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Zain:wght@700&display=swap" rel="stylesheet"/>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="../assets/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Bootstrap & Theme CSS -->
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/owl.carousel.css">
    <link rel="stylesheet" href="../assets/css/magnific-popup.css">
    <link rel="stylesheet" href="../assets/css/animate.css">
    <link rel="stylesheet" href="../assets/css/meanmenu.min.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">

    <!-- Custom Single Product Style -->
    <style>
      .single-product-area {
        padding: 100px 0;
        background: #f8f9fa;
      }
      .product-images img {
        width: 100%;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      }
      .product-info {
        background: #fff;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      }
      .product-price {
        font-size: 28px;
        color: #db8b27;
        font-weight: bold;
      }
      .add-to-cart-btn {
        background: #db8b27;
        color: white;
        padding: 15px 30px;
        border-radius: 50px;
        font-size: 18px;
        transition: 0.3s;
      }
      .add-to-cart-btn:hover {
        background: #2d3b2d;
        transform: translateY(-3px);
      }
    </style>
</head>
<body>

    <!-- PreLoader -->
    <div class="loader">
        <div class="loader-inner">
            <div class="circle"></div>
        </div>
    </div>

    <!-- Header (copy from index.html) -->
    <!-- Paste your full header code -->

    <!-- Mobile Bottom Bar (copy from index.html) -->
    <!-- Paste your full mobile bottom bar code -->

    <!-- Single Product Area -->
    <section class="single-product-area">
      <div class="container">
        <div class="row">
          <div class="col-lg-6 mb-5">
            <div class="product-images">
              <img id="product-image" alt="محصول">
            </div>
          </div>

          <div class="col-lg-6">
            <div class="product-info">
              <h2 id="product-name">در حال بارگذاری...</h2>
              <p id="product-description" class="text-muted mt-3">در حال بارگذاری...</p>

              <div class="mt-4">
                <p class="product-price" id="product-price">0 تومان</p>
              </div>

              <div class="mt-4">
                <p><strong>برند:</strong> <span id="product-brand">-</span></p>
                <p><strong>دسته‌بندی:</strong> <span id="product-category">-</span></p>
                <p><strong>موجودی:</strong> <span id="product-quantity">0</span></p>
              </div>

              <div class="mt-5 text-center">
                <button class="add-to-cart-btn" id="add-to-cart">
                  <i class="fas fa-shopping-cart"></i> افزودن به سبد خرید
                </button>
              </div>

              <div id="add-message" class="mt-3 text-center" style="display:none;"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <!-- Paste your footer -->

    <!-- Scripts -->
    <script src="../assets/js/jquery-1.11.3.min.js"></script>
	  <script src="../assets/js/jquery.isotope-3.0.6.min.js"></script>
    <script src="../assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="../assets/js/owl.carousel.min.js"></script>
    <script src="../assets/js/jquery.magnific-popup.min.js"></script>
    <script src="../assets/js/jquery.meanmenu.min.js"></script>
    <script src="../assets/js/sticker.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/utils.js"></script>
	<script src="../products/js/single-product.js"></script>
</body>
</html>
