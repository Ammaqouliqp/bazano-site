    <meta charset="UTF-8">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="../assets/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Bootstrap & Theme CSS -->

    <link rel="stylesheet" href="../assets/css/meanmenu.min.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">


    <!-- Custom OTP Login CSS (سبک سبز دقیق) -->
    <link rel="stylesheet" href="css/otp-login.css">
</head>
<body>

<!-- PreLoader -->
<div class="loader">
    <div class="loader-inner">
        <div class="circle"></div>
    </div>
</div>

<!-- Header (کپی از index.html) -->

<!-- هدر نهایی که درست کردیم رو اینجا بذار -->

<!-- OTP Login Section -->
<section class="login-section pt-150 pb-150">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-4 col-md-6 col-sm-8">
                <div class="login-card text-center">
                    <div class="text-center mb-4">
                        <div class="user-icon-circle">
                            <i class="fas fa-user"></i>
                        </div>

                    </div>

                    <!-- Step 1:) ورود اطلاعات -->
                    <!-- Step 1: Phone only -->
                    <div id="step1">
                    <form id="send-otp-form">
                        <h3 class="mt-3">ورود به حساب</h3>
                        <p class="text-muted">شماره تلفن خود را وارد کنید</p>
                        <div class="form-group mb-4">
                        <label>شماره تلفن</label>
                        <input 
                            type="tel" 
                            class="form-control" 
                            id="identifier" 
                            placeholder="09123456789" 
                            pattern="[0-9]{11}" 
                            maxlength="11" 
                            inputmode="numeric"
                            required>
                        </div>
                        <button type="submit" class="btn boxed-btn w-100" id="send-btn">
                        <span class="btn-text">دریافت کد</span>
                        <span class="btn-loading" style="display:none;"><i class="fas fa-spinner fa-spin"></i> در حال ارسال...</span>
                        </button>
                    </form>
                    </div>

                    <!-- Step 2: ورود کد -->
                    <div id="step2" style="display:none;">
                        <h4 class="text-center mb-3">کد تأیید را وارد کنید</h4>
                        <p class="text-center text-muted mb-4" id="sent-to"></p>

                        <form id="verify-otp-form">
                            <div class="form-group mb-4">
                                <input type="text" class="form-control text-center otp-input" id="otp-code" placeholder="— — — — — —" maxlength="6" required>
                            </div>

                            <button type="submit" class="btn boxed-btn w-100" id="verify-btn">
                                <span class="btn-text">ورود</span>
                                <span class="btn-loading" style="display:none;"><i class="fas fa-spinner fa-spin"></i> در حال بررسی...</span>
                            </button>

                            <div class="text-center mt-3">
                                <span class="timer" id="timer">۲:۰۰</span> | 
                                <a href="#" id="resend-code" class="text-muted">ارسال مجدد</a>
                            </div>
                        </form>
                    </div>

                    <div id="otp-error" class="text-danger text-center mt-3" style="display:none;"></div>

                    <div class="text-center mt-4">
                        <a href="../index.html" class="text-muted small">بازگشت به خانه</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Footer (کپی از index.html) -->
<!-- copyright -->
<div class="copyright">
	<div class="container">
		<div class="row">
			<div class="col-lg-6 col-md-12">
				<p>تمامی حقوق این سایت متعلق به بازانو است</p>
			</div>
			<div class="col-lg-6 text-right col-md-12">
				<div class="social-icons">
					<ul>
						<li><a href="http://ble.ir/bazano" target="_blank" class="bale-icon"><img src="../assets/img/icon/bale.svg" alt="Bale"></a></li>
						<li><a href="https://www.instagram.com/officialbazano/" target="https://www.instagram.com/officialbazano/"><i class="fab fa-instagram"></i></a></li>
						<li><a href="#" target="_blank"><i class="fab fa-telegram"></i></a></li>
					</ul>
			</div>
		</div>
	</div>
</div>
<!-- end copyright -->

<script src="../assets/js/jquery-1.11.3.min.js"></script>
