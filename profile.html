<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل کاربر - بازانو</title>

    <link rel="shortcut icon" type="image/png" href="../assets/img/icon_bazano.png">
    <!-- فونت فارسی -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@30.1.0/dist/font-face.css" rel="stylesheet" type="text/css" />
	  <!-- فونت فارسی Zain -->
	  <link href="https://fonts.googleapis.com/css2?family=Zain:wght@700&display=swap" rel="stylesheet"/>
    <!-- fontawesome -->
    <link rel="stylesheet" href="../assets/css/all.min.css">
    <!-- bootstrap -->
    <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
    <!-- owl carousel -->
    <link rel="stylesheet" href="../assets/css/owl.carousel.css">
    <!-- magnific popup -->
    <link rel="stylesheet" href="../assets/css/magnific-popup.css">
    <!-- animate css -->
    <link rel="stylesheet" href="../assets/css/animate.css">
    <!-- mean menu css -->
    <link rel="stylesheet" href="../assets/css/meanmenu.min.css">
    <!-- main style -->
    <link rel="stylesheet" href="../assets/css/main.css">
    <!-- responsive -->
    <link rel="stylesheet" href="../assets/css/responsive.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9BWb3k3J4qT7f5Z4f2r4C6o4iV6f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f4f" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>

    <!-- PreLoader -->
    <div class="loader">
        <div class="loader-inner">
            <div class="circle"></div>
        </div>
    </div>
    <!-- PreLoader Ends -->

    <!-- Include your header (copy from index.html or use the final one we fixed) -->
    <!-- header -->
    <div class="top-header-area" id="sticker">
      <div class="container">
        <div class="row align-items-center">
          <!-- Logo + Mobile Search -->
          <div class="col-12 col-lg-3 d-flex justify-content-between align-items-center">
            <a class="search-bar-icon d-lg-none mr-3" href="#">
              <i class="fas fa-search" style="font-size: 28px; color: #333;"></i>
            </a>
            <div class="site-logo mx-auto">
              <a href="index.html">
                <img src="assets/img/bazano-text-logo.png" alt="بازانو">
              </a>
            </div>
            <div class="d-lg-none" style="width: 40px;"></div>
          </div>

          <!-- Desktop Icons -->
          <div class="col-lg-9 d-none d-lg-block">
            <nav class="main-menu">
              <ul>
                <li class="notification" id="notif-desktop">
                  <a href="#" id="notif-desktop-btn">
                    <i class="fas fa-bell"></i>
                    <span class="badge" id="notif-count">0</span>
                  </a>
                </li>
                <li class="shopping-cart">
                  <a href="#" id="cart-desktop-btn">
                    <i class="fas fa-shopping-cart"></i>
                  </a>
                </li>
                <li class="profile-login" id="profile-desktop">
                  <!-- Filled by JS -->
                </li>
                <li class="search-center">
                  <a class="search-bar-icon" href="#">
                    <i class="fas fa-search"></i>
                  </a>
                </li>
              </ul>
            </nav>
          </div>
        </div>
      </div>
    </div>
    <!-- end header -->

    <!-- Mobile Bottom Bar -->
    <div class="mobile-bottom-bar d-lg-none">
      <div class="container">
        <ul>
          <li id="mobile-profile">
            <!-- Filled by JS -->
          </li>
          <li id="mobile-notif">
            <a href="#" id="mobile-notif-btn">
              <i class="fas fa-bell"></i>
              <span class="badge" id="mobile-notif-count">0</span>
            </a>
          </li>
          <li>
            <a href="#" id="mobile-cart-btn">
              <i class="fas fa-shopping-cart"></i>
            </a>
          </li>
        </ul>
      </div>
    </div>

    <!-- Full-Screen Search Overlay -->
    <div class="search-area">
      <div class="container">
        <div class="row">
          <div class="col-lg-12">
            <span class="close-btn"><i class="fas fa-window-close"></i></span>
            <div class="search-bar">
              <div class="search-bar-tablecell">
                <h3>جست و جو :</h3>
                <input type="text" placeholder="کالا  ، محصول و ...">
                <button type="submit">جست و جو <i class="fas fa-search"></i></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Profile Page Content -->
    <div class="hero-area hero-bg" style="padding: 100px 0; min-height: 80vh;">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-8 col-md-10">
            <div class="card bordered-btn" style="padding: 40px; border-radius: 15px; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
              <div class="text-center mb-4">
                <i class="fas fa-user-circle" style="font-size: 100px; color: #ff6f00;"></i>
                <h2 class="mt-3" id="user-name">کاربر عزیز</h2>
                <p id="user-phone">در حال بارگذاری...</p>
              </div>

              <div class="list-section">
                <h4 class="mb-4">اطلاعات پروفایل</h4>
                <ul class="list-group">
                  <li class="list-group-item d-flex justify-content-between">
                    <span>نام</span>
                    <strong id="profile-firstname">-</strong>
                  </li>
                  <li class="list-group-item d-flex justify-content-between">
                    <span>نام خانوادگی</span>
                    <strong id="profile-lastname">-</strong>
                  </li>
                  <li class="list-group-item d-flex justify-content-between">
                    <span>شماره تلفن</span>
                    <strong id="profile-phonenumber">-</strong>
                  </li>
                  <li class="list-group-item d-flex justify-content-between">
                    <span>ایمیل</span>
                    <strong id="profile-email">-</strong>
                  </li>
                  <li class="list-group-item d-flex justify-content-between">
                    <span>اعتبار کیف پول</span>
                    <strong id="profile-wallet">0 تومان</strong>
                  </li>
                </ul>
              </div>

              <div class="text-center mt-5">
                <a href="index.html" class="boxed-btn mr-3">بازگشت به خانه</a>
                <a href="#" id="logout-btn" class="bordered-btn">خروج از حساب</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer (copy from index.html) -->
    <div class="footer-area">
      <!-- Your footer code from index.html -->
    </div>

    <div class="copyright">
      <!-- Your copyright code -->
    </div>

    <!-- Scripts -->
    <script src="assets/js/jquery-1.11.3.min.js"></script>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/jquery.countdown.js"></script>
    <script src="assets/js/jquery.isotope-3.0.6.min.js"></script>
    <script src="assets/js/waypoints.js"></script>
    <script src="assets/js/owl.carousel.min.js"></script>
    <script src="assets/js/jquery.magnific-popup.min.js"></script>
    <script src="assets/js/jquery.meanmenu.min.js"></script>
    <script src="assets/js/sticker.js"></script>
    <script src="assets/js/main.js"></script>

    <!-- utils.js for header and token -->
    <script src="../assets/js/utils.js"></script>

    <!-- Profile Protection + Data Load -->
    <script>
      // Redirect if not logged in
      document.addEventListener('DOMContentLoaded', async function () {
        const token = localStorage.getItem('token');
        if (!token) {
          window.location.href = 'auth/login.html';
          return;
        }

        // Load user data from backend
        try {
          const user = await fetch('/api/users/me', {
            headers: { 'Authorization': `Bearer ${token}` }
          }).then(res => res.json());

          document.getElementById('user-name').textContent = `${user.firstname || ''} ${user.lastname || ''}`.trim() || 'کاربر عزیز';
          document.getElementById('user-phone').textContent = user.phonenumber || 'نامشخص';
          document.getElementById('profile-firstname').textContent = user.firstname || '-';
          document.getElementById('profile-lastname').textContent = user.lastname || '-';
          document.getElementById('profile-phonenumber').textContent = user.phonenumber || '-';
          document.getElementById('profile-email').textContent = user.email || '-';

          // Load wallet (example endpoint - adjust if different)
          const wallet = await fetch('/api/wallets/me', {
            headers: { 'Authorization': `Bearer ${token}` }
          }).then(res => res.json());
          document.getElementById('profile-wallet').textContent = (wallet.balance || 0) + ' تومان';

        } catch (err) {
          console.error('Error loading profile:', err);
          alert('خطا در بارگذاری اطلاعات پروفایل');
        }

        // Logout button
        document.getElementById('logout-btn').addEventListener('click', function(e) {
          e.preventDefault();
          localStorage.removeItem('token');
          window.location.href = 'index.html';
        });
      });
    </script>
</body>
</html>
